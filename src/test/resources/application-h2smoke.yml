# Docker 無しで全レイヤ(Controller→Service→Repository→DB)を通すスモークテスト専用プロファイル。
# PostgreSQL 互換モードの H2 インメモリを使い、スキーマは Hibernate が entity から生成する。
spring:
  datasource:
    url: jdbc:h2:mem:taskapi_smoke;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  docker:
    compose:
      enabled: false
