# 全プロファイル共通の設定。プロファイル固有は下部の "---" で区切ったドキュメントに置く。
# LEARN: このアプリは DB も認証も持たないので、設定は「運用エンドポイント」と
# 「API ドキュメント」の 2 つだけ。datasource や flyway の項目は無い。
spring:
  application:
    name: calc-api
  profiles:
    # LEARN: 起動時に -Dspring.profiles.active=... が無ければ local を使う。
    default: local

management:
  endpoints:
    web:
      exposure:
        # /actuator/health と /actuator/info だけ公開する。
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # タグ・オペレーションを名前順に並べると差分が安定する。
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

---
# ============================================================
# prod: Render などのクラウド環境。Dockerfile が SPRING_PROFILES_ACTIVE=prod を設定する。
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    # LEARN: 本番ではアプリのログだけ INFO。フレームワークの詳細ログは出さない。
    com.example.calc: INFO
