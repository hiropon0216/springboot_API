# ============================================================
# prod: Render 等のクラウド環境。値はすべて環境変数から。
# シークレット(DB 認証情報, JWT 秘密鍵)をリポジトリに置かない。
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      # LEARN: 本番コンテナ環境では docker-compose は使わない。
      # DB は Render の Managed PostgreSQL を利用し、DATABASE_URL 経由で接続する。
      enabled: false
  datasource:
    # LEARN: Render の Managed PostgreSQL は DATABASE_URL を提供する。
    # 形式は jdbc:postgresql://host:port/dbname。環境変数から注入する。
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration
    # LEARN: baseline-on-migrate は既存 DB への初回 Flyway 適用を安全にする。
    # Render の新規 DB に適用する際は不要だが、既存データがある場合の保険として残す。
    baseline-on-migrate: true
  jpa:
    show-sql: false
    hibernate:
      # LEARN: 本番では ddl-auto: validate。Flyway がスキーマを管理し、
      # Hibernate は「エンティティとテーブルが一致しているか」の検証だけ行う。
      # エンティティ直変更でスキーマが変わることを防ぐ。
      ddl-auto: validate

app:
  jwt:
    # LEARN: 本番の JWT 秘密鍵は環境変数から注入する。リポジトリには絶対に平文で書かない。
    # Render では render.yaml の generateValue: true で自動生成される。
    secret: ${APP_JWT_SECRET}
    expires-in-seconds: ${APP_JWT_EXPIRES_IN_SECONDS:3600}

logging:
  level:
    root: WARN
    # LEARN: アプリ固有のログは INFO に。デバッグ情報(SQL等)は本番では出力しない。
    com.example.taskapi: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # LEARN: Render のヘルスチェックは /actuator/health で行う。
      # コンテナ/ロードバランサからのヘルスチェック用に liveness/readiness を出す。
      probes:
        enabled: true
      show-details: never
