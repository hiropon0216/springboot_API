name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LEARN: Temurin 21 をセットアップし、~/.m2 をキャッシュする。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # LEARN: verify で compile → test(単体/スライス/Testcontainers) →
      # Spotless check → Checkstyle → ArchUnit まで一気に走る。
      # ubuntu-latest runner には Docker があるので Testcontainers も動く。
      - name: Build and verify
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
