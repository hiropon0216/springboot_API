# Render Blueprint 設定ファイル。
# LEARN: render.yaml があると Render の "New Blueprint Instance" でこのリポジトリを指定するだけで
# Web Service がプロビジョニングされる(Infrastructure as Code)。
# このアプリは DB も認証も持たないので、必要なのは Web Service 1 つだけ。
services:
  - type: web
    name: calc-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    # LEARN: /actuator/health が UP を返すまで Render はトラフィックを向けない。
    healthCheckPath: /actuator/health
